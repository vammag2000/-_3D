<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3D Rolling Ball - Meteor Drop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #canvas-container { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  #error-box {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(190, 0, 0, 0.92); color: #fff;
    font-family: monospace; font-size: 11px; line-height: 1.35;
    padding: 8px 12px; border-radius: 8px; max-width: 90vw;
    z-index: 9999; display: none; white-space: pre-wrap; text-align: center;
    pointer-events: none;
  }
  #loading {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    color: #fff; font-size: 17px; z-index: 100;
    background: #111; flex-direction: column; gap: 12px; text-align: center; padding: 20px;
  }
  #loading.hidden { display: none; }

  /* Прицел */
  #crosshair {
    position: fixed; top: 50%; left: 50%;
    width: 24px; height: 24px; transform: translate(-50%, -50%);
    display: none; z-index: 40; pointer-events: none;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #ff3333;
  }
  #crosshair::before { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }
  #crosshair::after { top: 0; left: 50%; width: 2px; height: 100%; transform: translateX(-50%); }
  
  #dpad { position: fixed; left: 16px; bottom: 16px; width: 150px; height: 150px; z-index: 50; }
  .dpad-btn {
    position: absolute; width: 50px; height: 50px;
    background: rgba(255,255,255,0.22);
    border: 2px solid rgba(255,255,255,0.45);
    border-radius: 10px; color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center; touch-action: none;
  }
  .dpad-btn.active { background: rgba(255,255,255,0.5); }
  #dpad-up    { left: 50px; top: 0; }
  #dpad-down  { left: 50px; bottom: 0; }
  #dpad-left  { left: 0; top: 50px; }
  #dpad-right { right: 0; top: 50px; }

  #jump-btn {
    position: fixed; right: 20px; bottom: 30px;
    width: 90px; height: 90px; border-radius: 50%;
    background: rgba(0, 150, 255, 0.35);
    border: 3px solid rgba(0, 150, 255, 0.7);
    color: #fff; font-size: 13px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    z-index: 50; touch-action: none;
  }
  #jump-btn.active { background: rgba(0, 150, 255, 0.65); }

  #dev-tools {
    position: fixed; top: 8px; right: 8px;
    display: none; flex-direction: column; gap: 4px;
    z-index: 100; max-width: 45vw;
  }
  #dev-tools.visible { display: flex; }
  #dev-tools button {
    padding: 7px 9px;
    background: rgba(25,25,25,0.9); border: 1px solid #555; color: #fff;
    border-radius: 6px; font-size: 11px; touch-action: manipulation; white-space: nowrap;
  }
  #dev-tools button.active { background: #062; border-color: #0f0; }
  #dev-tools button.danger { background: rgba(120,20,20,0.9); border-color: #a33; }

  #dev-info {
    position: fixed; top: 8px; left: 8px;
    background: rgba(0,0,0,0.75); color: #0f0;
    padding: 5px 8px; font-family: monospace; font-size: 10px;
    border-radius: 4px; display: none; z-index: 100;
    white-space: pre; line-height: 1.4; max-width: 50vw;
  }
  #dev-info.visible { display: block; }

  #coord-popup {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9); color: #0f0;
    padding: 15px 20px; font-family: monospace; font-size: 14px;
    border-radius: 8px; border: 1px solid #0f0;
    display: none; z-index: 200; white-space: pre; text-align: center;
    cursor: pointer;
  }
  #coord-popup.visible { display: block; }
  #coord-popup small { color: #888; font-size: 10px; display: block; margin-top: 8px; }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div id="error-box"></div>
<div id="loading">Загрузка...</div>
<div id="dev-info"></div>
<div id="crosshair"></div>
<div id="coord-popup" onclick="this.classList.remove('visible')"></div>

<div id="dpad">
  <div class="dpad-btn" id="dpad-up">▲</div>
  <div class="dpad-btn" id="dpad-down">▼</div>
  <div class="dpad-btn" id="dpad-left">◀</div>
  <div class="dpad-btn" id="dpad-right">▶</div>
</div>

<div id="jump-btn">JUMP</div>

<div id="dev-tools">
  <button id="btn-coords">Координаты</button>
  <button id="btn-editor">Редактор</button>
  <button id="btn-speed">🚀 Скорость: x1</button>
  <button id="btn-gizmo-translate" class="gizmo-btn">↔ Двигать</button>
  <button id="btn-gizmo-rotate" class="gizmo-btn">↻ Вращать</button>
  <button id="btn-clone">📄 Клонировать</button>
  <button id="btn-save">💾 Сохранить</button>
  <button id="btn-export">📋 Экспорт кода</button>
  <button id="btn-reset" class="danger">🗑 Сброс</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
// =========================================================
// 1) ОБРАБОТКА ОШИБОК
// =========================================================
const errorBox = document.getElementById('error-box');
function showError(msg, isGood = false) {
  errorBox.textContent = String(msg);
  errorBox.style.background = isGood ? 'rgba(0, 150, 0, 0.92)' : 'rgba(190, 0, 0, 0.92)';
  errorBox.style.display = 'block';
  clearTimeout(window._errTimeout);
  window._errTimeout = setTimeout(() => { errorBox.style.display = 'none'; }, 5000);
  console.log(msg);
}

window.onerror = (msg, src, line, col) => { showError(`ERR: ${msg} @ ${line}:${col}`); };
window.addEventListener('unhandledrejection', (e) => { showError(`PROMISE: ${e.reason}`); });

// =========================================================
// 2) ИМПОРТЫ И НАСТРОЙКИ
// =========================================================
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

const isDev = new URLSearchParams(location.search).get('dev') === '1';

const SAVED_OBJECTS = {
  "zov.glb_0": { "baseId": null, "pos": [ 0, 0, 0 ], "rot": [ 0, 0, 0 ], "scale": [ 1, 1, 1 ] },
  "wall.glb_1": { "baseId": null, "pos": [ -0.163, 1.343, -1.289 ], "rot": [ 0, 0, 0 ], "scale": [ 1, 1, 1 ] },
  "clone_7m7tln": { "baseId": "wall.glb_1", "pos": [ 1.837, 1.343, -1.289 ], "rot": [ 0, 0, 0 ], "scale": [ 1, 1, 1 ] },
  "clone_h3tsx8": { "baseId": "wall.glb_1", "pos": [ -0.2, 1.343, 1.011 ], "rot": [ 0, 0, 0 ], "scale": [ 1, 1, 1 ] },
  "clone_lhl0lr": { "baseId": "wall.glb_1", "pos": [ 1.8, 1.343, 1.011 ], "rot": [ 0, 0, 0 ], "scale": [ 1, 1, 1 ] },
  "clone_d3x7w1": { "baseId": "wall.glb_1", "pos": [ 3.8, 1.343, 1.011 ], "rot": [ 0, 0, 0 ], "scale": [ 1, 1, 1 ] },
  "clone_rczxfy": { "baseId": "wall.glb_1", "pos": [ 3.837, 1.343, -1.289 ], "rot": [ 0, 0, 0 ], "scale": [ 1, 1, 1 ] },
  "clone_y226gy": { "baseId": "wall.glb_1", "pos": [ 5.837, 1.343, -1.289 ], "rot": [ 0, 0, 0 ], "scale": [ 1, 1, 1 ] },
  "clone_ugltd9": { "baseId": "wall.glb_1", "pos": [ 5.8, 1.343, 1.011 ], "rot": [ 0, 0, 0 ], "scale": [ 1, 1, 1 ] },
  "clone_aib31u": { "baseId": "wall.glb_1", "pos": [ 7.179, 1.343, 0.579 ], "rot": [ 0, 0.6145, 0 ], "scale": [ 1, 1, 1 ] },
  "clone_1sbued": { "baseId": "wall.glb_1", "pos": [ 7.321, 1.343, -0.618 ], "rot": [ -3.1416, 0.8891, -3.1416 ], "scale": [ 1, 1, 1 ] }
};

const LEVEL_FILES = [ 'zov.glb', 'wall.glb' ];

const MAX_SPEED          = 7.0;   
const ACCELERATION       = 25.0;  
const FRICTION           = 3.0;   
const GRAVITY            = 22.0;  
const JUMP_SPEED         = 8.0;   
const FALL_RESPAWN_Y     = -20;   
const WALL_BOUNCE        = 0.2;   

// --- НАСТРОЙКИ ЭФФЕКТА МЕТЕОРА ---
const SPAWN_HEIGHT       = 180;   
const BURN_DURATION      = 2.0;   
const PARTICLE_COUNT     = 400;   

// =========================================================
// 3) THREE.JS БАЗА
// =========================================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x112233); 

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
container.appendChild(renderer.domElement);
const canvas = renderer.domElement;

scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(20, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
sun.shadow.bias = -0.001;
scene.add(sun);
scene.add(sun.target);

if (isDev) {
  const grid = new THREE.GridHelper(100, 100, 0xff0000, 0x555555);
  grid.position.y = 0.02;
  scene.add(grid);
}

// =========================================================
// 4) СОСТОЯНИЕ
// =========================================================
const state = {
  player: {
    mesh: null,
    auraMesh: null,
    radius: 0.5, 
    position: new THREE.Vector3(0, 0, 0),
    velocity: new THREE.Vector3(),
    grounded: false,
    spawnPoint: new THREE.Vector3(0, 1, 0),
    mode: 'falling', 
    burnTimer: 0,
    shakeTimer: 0,
  },
  camera: { orbitYaw: 0, orbitPitch: 0.4, distance: 14, target: new THREE.Vector3() }, 
  map: null,
  input: { forward: 0, right: 0, jumpBuffer: 0 },
};

const raycaster = new THREE.Raycaster();
const DOWN = new THREE.Vector3(0, -1, 0);
const UP = new THREE.Vector3(0, 1, 0);

// =========================================================
// 4.5) МОЩНАЯ СИСТЕМА ЧАСТИЦ (ОГОНЬ)
// =========================================================
const fireParticles = [];
const particleGeo = new THREE.BufferGeometry();
const particlePos = new Float32Array(PARTICLE_COUNT * 3);
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));

const pCanvas = document.createElement('canvas');
pCanvas.width = 128; pCanvas.height = 128;
const pCtx = pCanvas.getContext('2d');
const gradient = pCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');   
gradient.addColorStop(0.2, 'rgba(255, 255, 0, 1)');   
gradient.addColorStop(0.5, 'rgba(255, 100, 0, 0.8)'); 
gradient.addColorStop(0.8, 'rgba(255, 0, 0, 0.3)');   
gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');       
pCtx.fillStyle = gradient;
pCtx.fillRect(0, 0, 128, 128);
const particleTex = new THREE.CanvasTexture(pCanvas);

const particleMat = new THREE.PointsMaterial({
  size: 2.5, 
  map: particleTex,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true,
  opacity: 0.9,
  color: 0xffaa00
});

const particleSystem = new THREE.Points(particleGeo, particleMat);
scene.add(particleSystem);

const fireLight = new THREE.PointLight(0xff5500, 0, 30);
scene.add(fireLight);

function spawnFireParticle(pos, isFalling) {
  if (fireParticles.length >= PARTICLE_COUNT) return;
  
  const particle = {
    position: pos.clone(),
    life: 1.0
  };

  if (isFalling) {
    particle.velocity = new THREE.Vector3(
      (Math.random() - 0.5) * 8,
      Math.random() * 15 + 5,
      (Math.random() - 0.5) * 8
    );
  } else {
    particle.velocity = new THREE.Vector3(
      (Math.random() - 0.5) * 6,
      Math.random() * 8 + 2,
      (Math.random() - 0.5) * 6
    );
  }
  
  fireParticles.push(particle);
}

function updateFireParticles(dt) {
  const positions = particleSystem.geometry.attributes.position.array;
  
  for (let i = fireParticles.length - 1; i >= 0; i--) {
    const particle = fireParticles[i];
    particle.life -= dt * 1.2; 
    particle.position.add(particle.velocity.clone().multiplyScalar(dt));
    
    if (particle.life <= 0) {
      fireParticles.splice(i, 1);
    }
  }

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    if (i < fireParticles.length) {
      positions[i*3] = fireParticles[i].position.x;
      positions[i*3+1] = fireParticles[i].position.y;
      positions[i*3+2] = fireParticles[i].position.z;
    } else {
      positions[i*3] = 0;
      positions[i*3+1] = -1000; 
      positions[i*3+2] = 0;
    }
  }
  particleSystem.geometry.attributes.position.needsUpdate = true;
}

// =========================================================
// 5) ЗАГРУЗКА
// =========================================================
const loadingEl = document.getElementById('loading');
const loader = new GLTFLoader();

async function loadLevel() {
  state.map = new THREE.Group();
  scene.add(state.map);

  let objectCount = 0;

  for (const filename of LEVEL_FILES) {
    try {
      loadingEl.textContent = `Загрузка: ${filename}...`;
      const gltf = await loader.loadAsync(filename);
      const obj = gltf.scene;
      obj.traverse(o => { if (o.isMesh) o.receiveShadow = true; });
      obj.traverse(o => { if (o.isMesh) o.userData.editId = filename + '_' + (objectCount++); });
      state.map.add(obj);
    } catch (err) {
      showError(`Не удалось загрузить ${filename}: ` + err.message);
    }
  }

  applySavedObjects();

  const spawnY = findGroundHeight(0, 0);
  const sy = (spawnY !== null) ? spawnY : 0;
  
  state.player.spawnPoint.set(0, sy + SPAWN_HEIGHT, 0);
  state.player.position.copy(state.player.spawnPoint);
  if (state.player.mesh) state.player.mesh.position.copy(state.player.position);

  loadingEl.classList.add('hidden');
}

loadLevel();

loader.load('shell.glb', (gltf) => {
  const model = gltf.scene;
  model.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
      child.frustumCulled = false;
    }
  });

  model.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(model);
  let size = box.getSize(new THREE.Vector3());
  state.player.radius = size.y / 2.0; 

  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center); 

  const group = new THREE.Group();
  group.add(model);

  const auraGeo = new THREE.SphereGeometry(state.player.radius * 1.4, 16, 16);
  const auraMat = new THREE.MeshBasicMaterial({ 
    color: 0xff5500, 
    transparent: true, 
    opacity: 0.6, 
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const auraMesh = new THREE.Mesh(auraGeo, auraMat);
  group.add(auraMesh);
  state.player.auraMesh = auraMesh;

  scene.add(group);
  state.player.mesh = group;

  if (state.map) {
    state.player.position.y = (findGroundHeight(0, 0) || 0) + SPAWN_HEIGHT;
  }
  group.position.copy(state.player.position);

}, undefined, (err) => {
  showError('Ошибка shell.glb: ' + err.message);
});

// =========================================================
// 6) ФИЗИКА
// =========================================================
function findGroundHeight(x, z) {
  if (!state.map) return null;
  raycaster.set(new THREE.Vector3(x, 200, z), DOWN);
  raycaster.far = 500;
  const hits = raycaster.intersectObject(state.map, true).filter(h => h.object.visible && h.object.isMesh);
  return hits.length ? hits[0].point.y : null;
}

function isDescendantOf(obj, ancestor) {
  let p = obj;
  while (p) { if (p === ancestor) return true; p = p.parent; }
  return false;
}

function updatePhysics(dt) {
  const p = state.player;
  const cam = state.camera;

  let forwardInput = state.input.forward;
  let rightInput = state.input.right;
  let jumpInput = state.input.jumpBuffer;

  if (p.mode === 'falling' || p.mode === 'burning') {
    forwardInput = 0; rightInput = 0; jumpInput = 0;
  }

  const forward = new THREE.Vector3(-Math.sin(cam.orbitYaw), 0, -Math.cos(cam.orbitYaw));
  const right   = new THREE.Vector3( Math.cos(cam.orbitYaw), 0, -Math.sin(cam.orbitYaw));

  const inputDir = new THREE.Vector3();
  inputDir.addScaledVector(forward, forwardInput);
  inputDir.addScaledVector(right, rightInput);
  const hasInput = inputDir.lengthSq() > 0.0001;
  if (hasInput) inputDir.normalize();

  if (hasInput) {
    p.velocity.x += inputDir.x * ACCELERATION * dt;
    p.velocity.z += inputDir.z * ACCELERATION * dt;
    const horizSpeed = Math.hypot(p.velocity.x, p.velocity.z);
    if (horizSpeed > MAX_SPEED) {
      p.velocity.x = (p.velocity.x / horizSpeed) * MAX_SPEED;
      p.velocity.z = (p.velocity.z / horizSpeed) * MAX_SPEED;
    }
  } else {
    const frictionFactor = Math.max(0, 1 - FRICTION * dt);
    p.velocity.x *= frictionFactor;
    p.velocity.z *= frictionFactor;
    if (Math.hypot(p.velocity.x, p.velocity.z) < 0.1) {
      p.velocity.x = 0; p.velocity.z = 0;
    }
  }

  const deltaX = p.velocity.x * dt;
  const deltaZ = p.velocity.z * dt;
  
  if (state.map) {
    const origin = p.position.clone().add(new THREE.Vector3(0, p.radius, 0));
    if (Math.abs(deltaX) > 1e-5) {
      raycaster.set(origin, new THREE.Vector3(Math.sign(deltaX), 0, 0));
      raycaster.far = Math.abs(deltaX) + p.radius;
      const hits = raycaster.intersectObject(state.map, true).filter(h => h.object.visible && h.object.isMesh && h.point.y > p.position.y && h.point.y < p.position.y + p.radius * 1.5);
      if (hits.length > 0) p.velocity.x *= -WALL_BOUNCE; 
      else p.position.x += deltaX;
    }
    if (Math.abs(deltaZ) > 1e-5) {
      raycaster.set(origin, new THREE.Vector3(0, 0, Math.sign(deltaZ)));
      raycaster.far = Math.abs(deltaZ) + p.radius;
      const hits = raycaster.intersectObject(state.map, true).filter(h => h.object.visible && h.object.isMesh && h.point.y > p.position.y && h.point.y < p.position.y + p.radius * 1.5);
      if (hits.length > 0) p.velocity.z *= -WALL_BOUNCE; 
      else p.position.z += deltaZ;
    }
  }

  p.velocity.y -= GRAVITY * dt;
  
  if (jumpInput > 0) {
    state.input.jumpBuffer -= dt;
    if (p.grounded && p.mode === 'normal') {
      p.velocity.y = JUMP_SPEED;
      p.grounded = false;
      state.input.jumpBuffer = 0;
    }
  }

  p.position.y += p.velocity.y * dt;

  const groundY = findGroundHeight(p.position.x, p.position.z);
  if (groundY !== null && p.position.y - p.radius <= groundY) {
    p.position.y = groundY + p.radius;
    p.velocity.y = 0;
    p.grounded = true;
    
    if (p.mode === 'falling') {
      p.mode = 'burning';
      p.burnTimer = BURN_DURATION;
      p.shakeTimer = 0.5; 
      
      // ОГРОМНЫЙ взрыв частиц при ударе (исправлена ошибка с 'p')
      for (let i = 0; i < 100; i++) {
         const burstPos = p.position.clone();
         burstPos.y -= p.radius;
         
         const particle = { 
           position: burstPos, 
           velocity: new THREE.Vector3((Math.random()-0.5)*30, Math.random()*20, (Math.random()-0.5)*30), 
           life: 1.0 
         };
         fireParticles.push(particle);
      }
    }
  } else {
    p.grounded = false;
  }

  if (p.mode === 'falling' || p.mode === 'burning') {
    fireLight.position.copy(p.position);
    fireLight.intensity = 8 + Math.random() * 4; 
    if (p.auraMesh) p.auraMesh.visible = true;

    if (Math.random() < 0.9) {
      const spawnPos = p.position.clone();
      spawnPos.y -= p.radius * 0.5; 
      spawnFireParticle(spawnPos, p.mode === 'falling');
    }
  } else {
    if (p.auraMesh) p.auraMesh.visible = false;
    fireLight.intensity = 0;
  }

  if (p.mode === 'burning') {
    p.burnTimer -= dt;
    if (p.burnTimer <= 0) {
      p.mode = 'normal';
    }
  }

  if (p.position.y < FALL_RESPAWN_Y) {
    p.position.copy(p.spawnPoint);
    p.velocity.set(0, 0, 0);
    p.mode = 'falling';
    p.grounded = false;
  }

  if (p.mesh) {
    p.mesh.position.copy(p.position);
    const distX = p.velocity.x * dt;
    const distZ = p.velocity.z * dt;
    const distance = Math.hypot(distX, distZ);
    if (distance > 0.0001) {
      const moveDir = new THREE.Vector3(distX, 0, distZ).normalize();
      const rotAxis = new THREE.Vector3().crossVectors(UP, moveDir).normalize();
      const angle = distance / p.radius;
      const q = new THREE.Quaternion().setFromAxisAngle(rotAxis, angle);
      p.mesh.quaternion.premultiply(q);
    }
  }
}

function updateCamera(dt) {
  const cam = state.camera;
  const p = state.player;
  
  cam.target.lerp(p.position.clone().add(new THREE.Vector3(0, p.radius, 0)), Math.min(1, dt * 15));

  const hd = Math.cos(cam.orbitPitch) * cam.distance;
  const vd = Math.sin(cam.orbitPitch) * cam.distance;
  const desired = new THREE.Vector3(
    cam.target.x + Math.sin(cam.orbitYaw) * hd,
    cam.target.y + vd,
    cam.target.z + Math.cos(cam.orbitYaw) * hd
  );
  
  camera.position.lerp(desired, Math.min(1, dt * 20));
  
  if (p.shakeTimer > 0) {
    p.shakeTimer -= dt;
    const shakeAmt = p.shakeTimer * 0.5;
    camera.position.x += (Math.random() - 0.5) * shakeAmt;
    camera.position.y += (Math.random() - 0.5) * shakeAmt;
    camera.position.z += (Math.random() - 0.5) * shakeAmt;
  }
  
  camera.lookAt(cam.target);
}

// =========================================================
// 7) UI И ВВОД
// =========================================================
const dpad = { up: false, down: false, left: false, right: false };

function bindButton(el, onDown, onUp) {
  const down = e => { e.preventDefault(); onDown(); el.classList.add('active'); };
  const up   = e => { e.preventDefault(); onUp();   el.classList.remove('active'); };
  el.addEventListener('touchstart', down, { passive: false });
  el.addEventListener('touchend', up, { passive: false });
  el.addEventListener('touchcancel', up, { passive: false });
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
}

bindButton(document.getElementById('dpad-up'),    () => dpad.up = true,    () => dpad.up = false);
bindButton(document.getElementById('dpad-down'),  () => dpad.down = true,  () => dpad.down = false);
bindButton(document.getElementById('dpad-left'),  () => dpad.left = true,  () => dpad.left = false);
bindButton(document.getElementById('dpad-right'), () => dpad.right = true, () => dpad.right = false);
bindButton(document.getElementById('jump-btn'),   () => { state.input.jumpBuffer = 0.15; }, () => {});

function updateInputFromButtons() {
  state.input.forward = (dpad.up ? 1 : 0) - (dpad.down ? 1 : 0);
  state.input.right   = (dpad.right ? 1 : 0) - (dpad.left ? 1 : 0);
}

const activeTouches = new Map();
let pinchState = { active: false, startDist: 0, startZoom: 1 };
let tapInfo = { active: false, startTime: 0, startX: 0, startY: 0, moved: false };

canvas.addEventListener('touchstart', (e) => {
  if (dev.transformControls && dev.transformControls.dragging) return;
  for (const t of e.changedTouches) activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
  if (activeTouches.size === 1) {
    const t = e.changedTouches[0];
    tapInfo = { active: true, startTime: Date.now(), startX: t.clientX, startY: t.clientY, moved: false };
  }
  if (activeTouches.size === 2) {
    const ts = [...activeTouches.values()];
    pinchState.active = true;
    pinchState.startDist = Math.hypot(ts[0].x - ts[1].x, ts[0].y - ts[1].y);
    pinchState.startZoom = state.camera.distance;
    tapInfo.active = false;
  }
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  if (dev.transformControls && dev.transformControls.dragging) return;
  for (const t of e.changedTouches) {
    const prev = activeTouches.get(t.identifier);
    if (!prev) continue;
    const dx = t.clientX - prev.x;
    const dy = t.clientY - prev.y;
    if (activeTouches.size === 1) {
      if (dev.mode === 'coords') {
        dev.freeCam.yaw   -= dx * 0.006;
        dev.freeCam.pitch = Math.max(-1.4, Math.min(1.4, dev.freeCam.pitch - dy * 0.006));
      } else {
        state.camera.orbitYaw   -= dx * 0.006;
        state.camera.orbitPitch  = Math.max(-0.2, Math.min(1.3, state.camera.orbitPitch + dy * 0.006));
      }
      if (Math.hypot(t.clientX - tapInfo.startX, t.clientY - tapInfo.startY) > 10) tapInfo.moved = true;
    }
    prev.x = t.clientX; prev.y = t.clientY;
  }
  if (activeTouches.size === 2 && pinchState.active) {
    const ts = [...activeTouches.values()];
    const d = Math.hypot(ts[0].x - ts[1].x, ts[0].y - ts[1].y);
    if (pinchState.startDist > 1 && d > 1 && dev.mode !== 'coords') {
      state.camera.distance = Math.max(5, Math.min(40, pinchState.startZoom * (pinchState.startDist / d)));
    }
  }
}, { passive: true });

canvas.addEventListener('touchend', (e) => {
  if (dev.transformControls && dev.transformControls.dragging) return;
  for (const t of e.changedTouches) activeTouches.delete(t.identifier);
  if (activeTouches.size < 2) pinchState.active = false;
  if (tapInfo.active && !tapInfo.moved && Date.now() - tapInfo.startTime < 350 && activeTouches.size === 0) {
    const t = e.changedTouches[0];
    handleTap(t.clientX, t.clientY);
  }
  if (activeTouches.size === 0) tapInfo.active = false;
}, { passive: true });

canvas.addEventListener('touchcancel', (e) => {
  for (const t of e.changedTouches) activeTouches.delete(t.identifier);
  if (activeTouches.size < 2) pinchState.active = false;
  tapInfo.active = false;
}, { passive: true });

// =========================================================
// 8) DEV-РЕЖИМ
// =========================================================
const dev = {
  mode: 'play',
  freeCam: { pos: new THREE.Vector3(), yaw: 0, pitch: 0, fast: false },
  transformControls: null,
  selectedObject: null,
};

const devToolsEl  = document.getElementById('dev-tools');
const devInfoEl   = document.getElementById('dev-info');
const crosshairEl = document.getElementById('crosshair');
const coordPopup  = document.getElementById('coord-popup');

const btnCoords   = document.getElementById('btn-coords');
const btnEditor   = document.getElementById('btn-editor');
const btnSpeed    = document.getElementById('btn-speed');
const btnSave     = document.getElementById('btn-save');
const btnExport   = document.getElementById('btn-export');
const btnReset    = document.getElementById('btn-reset');
const btnClone    = document.getElementById('btn-clone');
const gizmoBtns   = document.querySelectorAll('.gizmo-btn');

if (isDev) { devToolsEl.classList.add('visible'); devInfoEl.classList.add('visible'); }

function setDevMode(mode) {
  dev.mode = mode;
  btnCoords.classList.toggle('active', mode === 'coords');
  btnEditor.classList.toggle('active', mode === 'editor');
  crosshairEl.style.display = (mode === 'coords') ? 'block' : 'none';

  if (mode === 'coords') {
    dev.freeCam.pos.copy(camera.position);
    const dir = camera.getWorldDirection(new THREE.Vector3());
    dev.freeCam.yaw   = Math.atan2(-dir.x, -dir.z);
    dev.freeCam.pitch = Math.asin(Math.max(-1, Math.min(1, dir.y)));
    if (dev.transformControls) dev.transformControls.detach();
    dev.selectedObject = null;
    coordPopup.classList.remove('visible');
  }
  if (mode !== 'editor' && dev.transformControls) {
    dev.transformControls.detach();
    dev.selectedObject = null;
  }
}

btnCoords.addEventListener('click', () => setDevMode(dev.mode === 'coords' ? 'play' : 'coords'));

btnSpeed.addEventListener('click', () => {
  dev.freeCam.fast = !dev.freeCam.fast;
  btnSpeed.textContent = dev.freeCam.fast ? '🚀 Скорость: x3' : '🚀 Скорость: x1';
  btnSpeed.classList.toggle('active', dev.freeCam.fast);
});

btnEditor.addEventListener('click', () => {
  if (dev.mode === 'editor') { setDevMode('play'); return; }
  setDevMode('editor');
  if (!dev.transformControls) {
    const tc = new TransformControls(camera, renderer.domElement);
    if (tc.getHelper) scene.add(tc.getHelper()); else scene.add(tc);
    tc.addEventListener('dragging-changed', (e) => {
      if (!e.value && dev.selectedObject) snapObjectToGround(dev.selectedObject);
    });
    dev.transformControls = tc;
  }
});

btnClone.addEventListener('click', () => {
  if (!dev.selectedObject) { alert('Сначала выбери объект!'); return; }
  const clone = dev.selectedObject.clone();
  clone.position.x += 2.0; 
  const baseId = dev.selectedObject.userData.baseId || dev.selectedObject.userData.editId;
  clone.userData = { ...dev.selectedObject.userData, editId: 'clone_' + Math.random().toString(36).substring(2, 8), baseId: baseId, edited: true };
  if (dev.selectedObject.parent) dev.selectedObject.parent.add(clone);
  else state.map.add(clone);
  dev.selectedObject = clone; 
  dev.transformControls.attach(clone);
  showError('Объект склонирован!', true);
});

gizmoBtns.forEach(b => b.addEventListener('click', () => {
  if (!dev.transformControls) return;
  if (b.id === 'btn-gizmo-translate') dev.transformControls.setMode('translate');
  if (b.id === 'btn-gizmo-rotate')    dev.transformControls.setMode('rotate');
}));

btnSave.addEventListener('click', () => {
  const data = collectObjectTransforms();
  localStorage.setItem('savedObjects', JSON.stringify(data));
  alert('Сохранено объектов: ' + Object.keys(data).length);
});

btnExport.addEventListener('click', () => {
  const data = collectObjectTransforms();
  const code = 'const SAVED_OBJECTS = ' + JSON.stringify(data, null, 2) + ';';
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(code).then(() => alert('Скопировано в буфер!')).catch(() => showExportDialog(code));
  } else { showExportDialog(code); }
});

btnReset.addEventListener('click', () => {
  if (confirm('Сбросить все сохранённые позиции?')) {
    localStorage.removeItem('savedObjects');
    location.reload();
  }
});

function showExportDialog(code) {
  const ta = document.createElement('textarea');
  ta.value = code;
  ta.style.cssText = 'position:fixed;top:10%;left:5%;width:90%;height:75%;z-index:10000;font-size:10px;padding:10px;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  const close = document.createElement('button');
  close.textContent = 'Закрыть';
  close.style.cssText = 'position:fixed;top:2%;right:5%;z-index:10001;padding:8px 14px;';
  close.onclick = () => { ta.remove(); close.remove(); };
  document.body.appendChild(close);
}

function collectObjectTransforms() {
  const out = {};
  if (!state.map) return out;
  state.map.traverse(o => {
    if (o.isMesh && o.userData.editId && o.userData.edited) {
      out[o.userData.editId] = { baseId: o.userData.baseId || null, pos: o.position.toArray().map(v => +v.toFixed(3)), rot: [o.rotation.x, o.rotation.y, o.rotation.z].map(v => +v.toFixed(4)), scale: o.scale.toArray().map(v => +v.toFixed(3)) };
    }
  });
  return out;
}

function applySavedObjects() {
  if (!state.map) return;
  let data = SAVED_OBJECTS; 
  try {
    const ls = JSON.parse(localStorage.getItem('savedObjects') || 'null');
    if (ls && Object.keys(ls).length) data = ls; 
  } catch(e) {}
  if (!data || !Object.keys(data).length) return;

  state.map.traverse(o => {
    if (o.isMesh && o.userData.editId && data[o.userData.editId]) {
      const d = data[o.userData.editId];
      o.position.fromArray(d.pos); o.rotation.set(d.rot[0], d.rot[1], d.rot[2]); o.scale.fromArray(d.scale);
      o.userData.edited = true;
      if (d.baseId) o.userData.baseId = d.baseId;
    }
  });

  const clonesToCreate = [];
  for (const [id, d] of Object.entries(data)) {
    if (d.baseId) {
      let exists = false;
      state.map.traverse(o => { if (o.userData.editId === id) exists = true; });
      if (!exists) clonesToCreate.push({ id, data: d });
    }
  }

  for (const item of clonesToCreate) {
    let sourceObj = null;
    state.map.traverse(o => { if (o.userData.editId === item.data.baseId) sourceObj = o; });
    if (sourceObj) {
      const clone = sourceObj.clone();
      clone.position.fromArray(item.data.pos); clone.rotation.set(item.data.rot[0], item.data.rot[1], item.data.rot[2]); clone.scale.fromArray(item.data.scale);
      clone.userData = { ...sourceObj.userData, editId: item.id, baseId: item.data.baseId, edited: true };
      if (sourceObj.parent) sourceObj.parent.add(clone);
      else state.map.add(clone);
    }
  }
}

function snapObjectToGround(obj) {
  if (!state.map || !obj) return;
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty()) return;
  const center = box.getCenter(new THREE.Vector3());
  raycaster.set(new THREE.Vector3(center.x, box.max.y + 5, center.z), DOWN);
  raycaster.far = 1000;
  const hits = raycaster.intersectObject(state.map, true).filter(h => !isDescendantOf(h.object, obj) && h.object.visible);
  if (hits.length) {
    const deltaY = hits[0].point.y - box.min.y;
    const worldPos = new THREE.Vector3();
    obj.getWorldPosition(worldPos); worldPos.y += deltaY;
    if (obj.parent) obj.parent.worldToLocal(worldPos);
    obj.position.copy(worldPos);
    obj.userData.edited = true;
  }
}

function handleTap(x, y) {
  const ndc = new THREE.Vector2((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  if (dev.mode === 'coords') {
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); 
    raycaster.far = 2000;
    const hits = raycaster.intersectObjects(scene.children, true);
    if (hits.length) {
      const p = hits[0].point;
      coordPopup.innerHTML = `X: ${p.x.toFixed(2)}<br>Y: ${p.y.toFixed(2)}<br>Z: ${p.z.toFixed(2)}<br><small>(Нажми, чтобы скопировать)</small>`;
      coordPopup.classList.add('visible');
      coordPopup.onclick = () => {
        const textToCopy = `X: ${p.x.toFixed(2)}, Y: ${p.y.toFixed(2)}, Z: ${p.z.toFixed(2)}`;
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(textToCopy).then(() => { coordPopup.innerHTML = `Скопировано!<br><small>(Нажми, чтобы закрыть)</small>`; }).catch(() => { coordPopup.classList.remove('visible'); });
        } else coordPopup.classList.remove('visible');
      };
    }
  } else if (dev.mode === 'editor' && state.map) {
    raycaster.setFromCamera(ndc, camera); raycaster.far = 1000;
    const hits = raycaster.intersectObject(state.map, true);
    if (hits.length) {
      dev.selectedObject = hits[0].object; dev.selectedObject.userData.edited = true;
      dev.transformControls.attach(dev.selectedObject);
    } else { dev.selectedObject = null; dev.transformControls.detach(); }
  }
}

function updateFreeCamera(dt) {
  const fc = dev.freeCam;
  const fwd = new THREE.Vector3(-Math.sin(fc.yaw) * Math.cos(fc.pitch), Math.sin(fc.pitch), -Math.cos(fc.yaw) * Math.cos(fc.pitch));
  const rgt = new THREE.Vector3(Math.cos(fc.yaw), 0, -Math.sin(fc.yaw));
  const speed = fc.fast ? 25 : 8;
  fc.pos.addScaledVector(fwd, state.input.forward * speed * dt);
  fc.pos.addScaledVector(rgt, state.input.right   * speed * dt);
  if (state.input.jumpBuffer > 0) { fc.pos.y += speed * dt * 1.5; state.input.jumpBuffer = 0; }
  camera.position.copy(fc.pos);
  camera.rotation.set(fc.pitch, fc.yaw, 0, 'YXZ');
}

// =========================================================
// 9) ГЛАВНЫЙ ЦИКЛ
// =========================================================
let lastTime = performance.now();
let frameCount = 0, fpsTime = 0, fps = 60;

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;

  frameCount++; fpsTime += dt;
  if (fpsTime >= 0.5) { fps = Math.round(frameCount / fpsTime); frameCount = 0; fpsTime = 0; }

  updateInputFromButtons();

  if (dev.mode === 'coords') {
    updateFreeCamera(dt);
  } else {
    updatePhysics(dt);
    updateCamera(dt);
  }

  updateFireParticles(dt);

  if (isDev) {
    sun.position.set(state.player.position.x + 20, state.player.position.y + 40, state.player.position.z + 20);
    sun.target.position.copy(state.player.position);
    sun.target.updateMatrixWorld();
    const camPos = camera.position;
    devInfoEl.textContent = `FPS: ${fps}\nMode: ${dev.mode}\nCam: ${camPos.x.toFixed(1)}, ${camPos.y.toFixed(1)}, ${camPos.z.toFixed(1)}\n` + (dev.mode === 'play' ? `Ball: ${state.player.position.x.toFixed(1)}, ${state.player.position.y.toFixed(1)}, ${state.player.position.z.toFixed(1)}` : '');
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
