<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3D Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #canvas-container { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  #error-box {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(190, 0, 0, 0.92); color: #fff;
    font-family: monospace; font-size: 11px; line-height: 1.35;
    padding: 8px 12px; border-radius: 8px; max-width: 90vw;
    z-index: 9999; display: none; white-space: pre-wrap; text-align: center;
    pointer-events: none;
  }
  #loading {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    color: #fff; font-size: 17px; z-index: 100;
    background: #111; flex-direction: column; gap: 12px; text-align: center; padding: 20px;
  }
  #loading.hidden { display: none; }

  #dpad { position: fixed; left: 16px; bottom: 16px; width: 150px; height: 150px; z-index: 50; }
  .dpad-btn {
    position: absolute; width: 50px; height: 50px;
    background: rgba(255,255,255,0.22);
    border: 2px solid rgba(255,255,255,0.45);
    border-radius: 10px; color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center; touch-action: none;
  }
  .dpad-btn.active { background: rgba(255,255,255,0.5); }
  #dpad-up    { left: 50px; top: 0; }
  #dpad-down  { left: 50px; bottom: 0; }
  #dpad-left  { left: 0; top: 50px; }
  #dpad-right { right: 0; top: 50px; }

  #jump-btn {
    position: fixed; right: 20px; bottom: 30px;
    width: 90px; height: 90px; border-radius: 50%;
    background: rgba(0, 150, 255, 0.35);
    border: 3px solid rgba(0, 150, 255, 0.7);
    color: #fff; font-size: 13px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    z-index: 50; touch-action: none;
  }
  #jump-btn.active { background: rgba(0, 150, 255, 0.65); }

  #dev-tools {
    position: fixed; top: 8px; right: 8px;
    display: none; flex-direction: column; gap: 4px;
    z-index: 100; max-width: 44vw;
  }
  #dev-tools.visible { display: flex; }
  #dev-tools button {
    padding: 7px 9px;
    background: rgba(25,25,25,0.9); border: 1px solid #555; color: #fff;
    border-radius: 6px; font-size: 11px; touch-action: manipulation; white-space: nowrap;
  }
  #dev-tools button.active { background: #062; border-color: #0f0; }
  #dev-tools button.danger { background: rgba(120,20,20,0.9); border-color: #a33; }

  #dev-info {
    position: fixed; top: 8px; left: 8px;
    background: rgba(0,0,0,0.75); color: #0f0;
    padding: 5px 8px; font-family: monospace; font-size: 10px;
    border-radius: 4px; display: none; z-index: 100;
    white-space: pre; line-height: 1.4; max-width: 50vw;
  }
  #dev-info.visible { display: block; }

  #coord-popup {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9); color: #0f0;
    padding: 10px 16px; font-family: monospace; font-size: 13px;
    border-radius: 8px; border: 1px solid #0f0;
    display: none; z-index: 200; white-space: pre; text-align: center;
  }
  #coord-popup.visible { display: block; }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div id="error-box"></div>
<div id="loading">Загрузка игры...</div>
<div id="dev-info"></div>
<div id="coord-popup"></div>

<div id="dpad">
  <div class="dpad-btn" id="dpad-up">▲</div>
  <div class="dpad-btn" id="dpad-down">▼</div>
  <div class="dpad-btn" id="dpad-left">◀</div>
  <div class="dpad-btn" id="dpad-right">▶</div>
</div>

<div id="jump-btn">JUMP</div>

<div id="dev-tools">
  <button id="btn-coords">Координаты</button>
  <button id="btn-editor">Редактор</button>
  <button id="btn-gizmo-translate" class="gizmo-btn">↔ Двигать</button>
  <button id="btn-gizmo-rotate" class="gizmo-btn">↻ Вращать</button>
  <button id="btn-gizmo-scale" class="gizmo-btn">⤢ Масштаб</button>
  <button id="btn-save">💾 Сохранить</button>
  <button id="btn-export">📋 Экспорт кода</button>
  <button id="btn-reset" class="danger">🗑 Сброс</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
// =========================================================
// 1) ОБРАБОТКА ОШИБОК
// =========================================================
const errorBox = document.getElementById('error-box');
function showError(msg, isGood = false) {
  errorBox.textContent = String(msg);
  errorBox.style.background = isGood ? 'rgba(0, 150, 0, 0.92)' : 'rgba(190, 0, 0, 0.92)';
  errorBox.style.display = 'block';
  clearTimeout(window._errTimeout);
  window._errTimeout = setTimeout(() => { errorBox.style.display = 'none'; }, 6000);
  console.log(msg);
}

window.onerror = (msg, src, line, col) => { showError(`ERR: ${msg} @ ${line}:${col}`); };
window.addEventListener('unhandledrejection', (e) => { showError(`PROMISE: ${e.reason}`); });

// =========================================================
// 2) ИМПОРТЫ И НАСТРОЙКИ
// =========================================================
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

const isDev = new URLSearchParams(location.search).get('dev') === '1';
const SAVED_OBJECTS = {};

const PLAYER_HEIGHT      = 1.6;
const PLAYER_RADIUS      = 0.35;
const MOVE_SPEED         = 4.0; 
const GRAVITY            = 22.0;
const JUMP_SPEED         = 8.0;
const AIR_CONTROL        = 0.45;
const FALL_RESPAWN_Y     = -20;   
const MODEL_FORWARD_OFFSET = 0;
const PLAYER_Y_OFFSET      = 0.0; 

// =========================================================
// 3) THREE.JS БАЗА
// =========================================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x88bbdd);

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
container.appendChild(renderer.domElement);
const canvas = renderer.domElement;

scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(20, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
sun.shadow.bias = -0.001;
scene.add(sun);
scene.add(sun.target);

if (isDev) {
  const grid = new THREE.GridHelper(50, 50, 0xff0000, 0x555555);
  grid.position.y = 0.02;
  scene.add(grid);
}

// =========================================================
// 4) СОСТОЯНИЕ
// =========================================================
const state = {
  player: {
    mesh: null,
    modelBaseY: 0,
    walkCycle: 0,
    mixer: null,
    actions: { idle: null, walk: null },
    currentAction: null,
    position: new THREE.Vector3(0, 0, 0),
    velocity: new THREE.Vector3(),
    grounded: false,
    targetYaw: 0,
    spawnPoint: new THREE.Vector3(0, 1, 0),
    
    // Для фиксации таза
    hipBone: null, 
    hipRestQuat: new THREE.Quaternion(),
  },
  camera: { orbitYaw: 0, orbitPitch: 0.35, distance: 6, target: new THREE.Vector3() },
  map: null,
  input: { forward: 0, right: 0, jumpBuffer: 0 },
};

const raycaster = new THREE.Raycaster();
const DOWN = new THREE.Vector3(0, -1, 0);

// =========================================================
// 5) ЗАГРУЗКА
// =========================================================
const loadingEl = document.getElementById('loading');
const loader = new GLTFLoader();
let loadedCount = 0;

function checkLoaded() {
  loadedCount++;
  if (loadedCount >= 2) loadingEl.classList.add('hidden');
}

// ----- MAP -----
loader.load('zov.glb', (gltf) => {
  const map = gltf.scene;
  map.traverse(o => { if (o.isMesh) o.receiveShadow = true; });
  scene.add(map);
  state.map = map;

  let i = 0;
  map.traverse(o => { if (o.isMesh) o.userData.editId = 'obj_' + (i++); });
  applySavedObjects();

  const spawnY = findGroundHeight(0, 0);
  const sy = (spawnY !== null) ? spawnY : 0;
  state.player.spawnPoint.set(0, sy, 0);
  state.player.position.copy(state.player.spawnPoint);
  if (state.player.mesh) state.player.mesh.position.copy(state.player.position);

  checkLoaded();
}, undefined, (err) => {
  showError('Ошибка zov.glb: ' + err.message);
  checkLoaded();
});

// ----- CHARACTER -----
loader.load('shell.glb', (gltf) => {
  const model = gltf.scene;
  model.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
      child.frustumCulled = false;
    }
  });

  // Ищем кость таза, чтобы потом её выпрямлять
  model.traverse((node) => {
    if (node.isBone) {
      const name = node.name.toLowerCase();
      if (name === 'hip' || name === 'hips' || name === 'pelvis') {
        state.player.hipBone = node;
        state.player.hipRestQuat.copy(node.quaternion);
      }
    }
  });

  model.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(model);
  let size = box.getSize(new THREE.Vector3());
  if (size.y > 0.01) model.scale.setScalar(PLAYER_HEIGHT / size.y);

  model.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  
  model.position.x = -center.x;
  model.position.z = -center.z;
  model.position.y = -box.min.y + PLAYER_Y_OFFSET;
  state.player.modelBaseY = model.position.y; 

  const group = new THREE.Group();
  group.add(model);
  scene.add(group);
  state.player.mesh = group;
  group.position.copy(state.player.position);

  // ВКЛЮЧАЕМ АНИМАЦИЮ ОБРАТНО, НО ЧИСТИМ ЕЁ
  if (gltf.animations && gltf.animations.length > 0) {
    const mixer = new THREE.AnimationMixer(model);
    state.player.mixer = mixer;
    const clips = gltf.animations;

    if (clips.length === 1) {
      const rawClip = clips[0];
      const fps = 30; 
      const totalFrames = Math.floor(rawClip.duration * fps);
      const half = Math.floor(totalFrames / 2);
      
      let walkClip = THREE.AnimationUtils.subclip(rawClip, 'Walk', 0, half, fps);
      let idleClip = THREE.AnimationUtils.subclip(rawClip, 'Idle', half, totalFrames, fps);
      
      // Очищаем анимацию от смещений
      const cleanClip = (clip) => {
        clip.tracks.forEach(t => {
          if (t.name.endsWith('.position')) {
            for (let i = 0; i < t.values.length; i += 3) {
              t.values[i] = 0;     // X
              t.values[i+2] = 0;   // Z
            }
          }
        });
      };
      
      cleanClip(walkClip);
      cleanClip(idleClip);

      state.player.actions.idle = mixer.clipAction(idleClip);
      state.player.actions.walk = mixer.clipAction(walkClip);
      state.player.actions.idle.play();
      state.player.currentAction = state.player.actions.idle;
      
      showError("Анимация включена. Таз жестко зафиксирован.", true);
    } else {
      const findClip = (kw) => clips.find(c => c.name.toLowerCase().includes(kw));
      let idleClip = findClip('idle') || findClip('stand') || clips[0];
      let walkClip = findClip('walk') || findClip('run') || clips[1];

      if (idleClip) {
        state.player.actions.idle = mixer.clipAction(idleClip);
        state.player.actions.idle.play();
        state.player.currentAction = state.player.actions.idle;
      }
      if (walkClip) {
        state.player.actions.walk = mixer.clipAction(walkClip);
      }
      showError("Загружены 2+ анимации. Таз зафиксирован.", true);
    }
  } else {
    showError("В файле НЕТ анимаций! Включена псевдо-анимация.");
  }

  checkLoaded();
}, undefined, (err) => {
  showError('Ошибка shell.glb: ' + err.message);
  checkLoaded();
});

// =========================================================
// 6) ФИЗИКА
// =========================================================
function findGroundHeight(x, z) {
  if (!state.map) return null;
  raycaster.set(new THREE.Vector3(x, 200, z), DOWN);
  raycaster.far = 500;
  const hits = raycaster.intersectObject(state.map, true).filter(h => h.object.visible && h.object.isMesh);
  return hits.length ? hits[0].point.y : null;
}

function isDescendantOf(obj, ancestor) {
  let p = obj;
  while (p) { if (p === ancestor) return true; p = p.parent; }
  return false;
}

function updatePhysics(dt) {
  const p = state.player;
  const cam = state.camera;

  const forward = new THREE.Vector3(-Math.sin(cam.orbitYaw), 0, -Math.cos(cam.orbitYaw));
  const right   = new THREE.Vector3( Math.cos(cam.orbitYaw), 0, -Math.sin(cam.orbitYaw));

  const moveDir = new THREE.Vector3();
  moveDir.addScaledVector(forward, state.input.forward);
  moveDir.addScaledVector(right,   state.input.right);
  const isMoving = moveDir.lengthSq() > 0.0001;
  if (isMoving) moveDir.normalize();

  const control = p.grounded ? 1 : AIR_CONTROL;
  const delta = moveDir.clone().multiplyScalar(MOVE_SPEED * control * dt);

  if (isMoving && state.map && delta.lengthSq() > 0) {
    const origin = p.position.clone().add(new THREE.Vector3(0, PLAYER_HEIGHT * 0.5, 0));
    raycaster.set(origin, delta.clone().normalize());
    raycaster.far = PLAYER_RADIUS + delta.length();
    
    const hits = raycaster.intersectObject(state.map, true).filter(h => 
      h.object.visible && h.object.isMesh &&
      h.point.y > p.position.y + 0.25 && h.point.y < p.position.y + PLAYER_HEIGHT * 0.9
    );

    if (hits.length === 0) {
      p.position.x += delta.x;
      p.position.z += delta.z;
    } else {
      if (Math.abs(delta.x) > 1e-4) {
        raycaster.set(origin, new THREE.Vector3(Math.sign(delta.x), 0, 0));
        raycaster.far = Math.abs(delta.x) + PLAYER_RADIUS;
        if (raycaster.intersectObject(state.map, true).filter(h => h.object.visible && h.point.y > p.position.y + 0.25 && h.point.y < p.position.y + PLAYER_HEIGHT * 0.9).length === 0) p.position.x += delta.x;
      }
      if (Math.abs(delta.z) > 1e-4) {
        raycaster.set(origin, new THREE.Vector3(0, 0, Math.sign(delta.z)));
        raycaster.far = Math.abs(delta.z) + PLAYER_RADIUS;
        if (raycaster.intersectObject(state.map, true).filter(h => h.object.visible && h.point.y > p.position.y + 0.25 && h.point.y < p.position.y + PLAYER_HEIGHT * 0.9).length === 0) p.position.z += delta.z;
      }
    }
  }

  p.velocity.y -= GRAVITY * dt;
  p.position.y += p.velocity.y * dt;

  const groundY = findGroundHeight(p.position.x, p.position.z);
  if (groundY !== null && p.position.y <= groundY) {
    p.position.y = groundY;
    p.velocity.y = 0;
    p.grounded = true;
  } else {
    p.grounded = false;
  }

  if (state.input.jumpBuffer > 0) {
    state.input.jumpBuffer -= dt;
    if (p.grounded) {
      p.velocity.y = JUMP_SPEED;
      p.grounded = false;
      state.input.jumpBuffer = 0;
    }
  }

  if (p.position.y < FALL_RESPAWN_Y) {
    p.position.copy(p.spawnPoint);
    p.velocity.set(0, 0, 0);
    p.grounded = false;
  }

  // --- ВИЗУАЛ ---
  if (p.mesh) {
    p.mesh.position.copy(p.position);
    if (isMoving) p.targetYaw = Math.atan2(moveDir.x, moveDir.z) + MODEL_FORWARD_OFFSET;
    
    let diff = p.targetYaw - p.mesh.rotation.y;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    p.mesh.rotation.y += diff * Math.min(1, dt * 12);

    // Псевдо-анимация, если НЕТ реальных анимаций
    if (!p.mixer && p.mesh.children.length > 0) {
      const model = p.mesh.children[0];
      if (isMoving && p.grounded) {
        p.walkCycle += dt * 12; 
        model.position.y = p.modelBaseY + Math.abs(Math.sin(p.walkCycle)) * 0.08; 
      } else {
        p.walkCycle = 0;
        model.position.y += (p.modelBaseY - model.position.y) * Math.min(1, dt * 10);
      }
    }
  }
}

function updateAnimation(dt) {
  const p = state.player;
  if (!p.mixer) return; 
  
  const isMoving = Math.abs(state.input.forward) > 0.01 || Math.abs(state.input.right) > 0.01;

  p.mixer.update(dt);

  // КОСТЫЛЬ: Принудительно выпрямляем таз после каждого кадра анимации
  if (p.hipBone) {
    p.hipBone.quaternion.copy(p.hipRestQuat);
  }

  const targetAction = isMoving ? p.actions.walk : p.actions.idle;

  if (targetAction && targetAction !== p.currentAction) {
    if (p.currentAction) p.currentAction.fadeOut(0.2);
    targetAction.reset().fadeIn(0.2).play();
    p.currentAction = targetAction;
  }
}

function updateCamera(dt) {
  const cam = state.camera;
  const p = state.player;
  cam.target.lerp(p.position.clone().add(new THREE.Vector3(0, 1.2, 0)), Math.min(1, dt * 12));

  const hd = Math.cos(cam.orbitPitch) * cam.distance;
  const vd = Math.sin(cam.orbitPitch) * cam.distance;
  const desired = new THREE.Vector3(
    cam.target.x + Math.sin(cam.orbitYaw) * hd,
    cam.target.y + vd,
    cam.target.z + Math.cos(cam.orbitYaw) * hd
  );
  camera.position.lerp(desired, Math.min(1, dt * 15));
  camera.lookAt(cam.target);
}

// =========================================================
// 7) UI И ВВОД
// =========================================================
const dpad = { up: false, down: false, left: false, right: false };

function bindButton(el, onDown, onUp) {
  const down = e => { e.preventDefault(); onDown(); el.classList.add('active'); };
  const up   = e => { e.preventDefault(); onUp();   el.classList.remove('active'); };
  el.addEventListener('touchstart', down, { passive: false });
  el.addEventListener('touchend', up, { passive: false });
  el.addEventListener('touchcancel', up, { passive: false });
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
}

bindButton(document.getElementById('dpad-up'),    () => dpad.up = true,    () => dpad.up = false);
bindButton(document.getElementById('dpad-down'),  () => dpad.down = true,  () => dpad.down = false);
bindButton(document.getElementById('dpad-left'),  () => dpad.left = true,  () => dpad.left = false);
bindButton(document.getElementById('dpad-right'), () => dpad.right = true, () => dpad.right = false);
bindButton(document.getElementById('jump-btn'),   () => { state.input.jumpBuffer = 0.15; }, () => {});

function updateInputFromButtons() {
  state.input.forward = (dpad.up ? 1 : 0) - (dpad.down ? 1 : 0);
  state.input.right   = (dpad.right ? 1 : 0) - (dpad.left ? 1 : 0);
}

// Тач-управление
const activeTouches = new Map();
let pinchState = { active: false, startDist: 0, startZoom: 1 };
let tapInfo = { active: false, startTime: 0, startX: 0, startY: 0, moved: false };

canvas.addEventListener('touchstart', (e) => {
  if (dev.transformControls && dev.transformControls.dragging) return;
  for (const t of e.changedTouches) activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
  if (activeTouches.size === 1) {
    const t = e.changedTouches[0];
    tapInfo = { active: true, startTime: Date.now(), startX: t.clientX, startY: t.clientY, moved: false };
  }
  if (activeTouches.size === 2) {
    const ts = [...activeTouches.values()];
    pinchState.active = true;
    pinchState.startDist = Math.hypot(ts[0].x - ts[1].x, ts[0].y - ts[1].y);
    pinchState.startZoom = state.camera.distance;
    tapInfo.active = false;
  }
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  if (dev.transformControls && dev.transformControls.dragging) return;
  for (const t of e.changedTouches) {
    const prev = activeTouches.get(t.identifier);
    if (!prev) continue;
    const dx = t.clientX - prev.x;
    const dy = t.clientY - prev.y;
    if (activeTouches.size === 1) {
      if (dev.mode === 'coords') {
        dev.freeCam.yaw   -= dx * 0.006;
        dev.freeCam.pitch = Math.max(-1.4, Math.min(1.4, dev.freeCam.pitch - dy * 0.006));
      } else {
        state.camera.orbitYaw   -= dx * 0.006;
        state.camera.orbitPitch  = Math.max(-0.2, Math.min(1.3, state.camera.orbitPitch + dy * 0.006));
      }
      if (Math.hypot(t.clientX - tapInfo.startX, t.clientY - tapInfo.startY) > 10) tapInfo.moved = true;
    }
    prev.x = t.clientX; prev.y = t.clientY;
  }
  if (activeTouches.size === 2 && pinchState.active) {
    const ts = [...activeTouches.values()];
    const d = Math.hypot(ts[0].x - ts[1].x, ts[0].y - ts[1].y);
    if (pinchState.startDist > 1 && d > 1 && dev.mode !== 'coords') {
      state.camera.distance = Math.max(2, Math.min(20, pinchState.startZoom * (pinchState.startDist / d)));
    }
  }
}, { passive: true });

canvas.addEventListener('touchend', (e) => {
  if (dev.transformControls && dev.transformControls.dragging) return;
  for (const t of e.changedTouches) activeTouches.delete(t.identifier);
  if (activeTouches.size < 2) pinchState.active = false;
  if (tapInfo.active && !tapInfo.moved && Date.now() - tapInfo.startTime < 350 && activeTouches.size === 0) {
    const t = e.changedTouches[0];
    handleTap(t.clientX, t.clientY);
  }
  if (activeTouches.size === 0) tapInfo.active = false;
}, { passive: true });

canvas.addEventListener('touchcancel', (e) => {
  for (const t of e.changedTouches) activeTouches.delete(t.identifier);
  if (activeTouches.size < 2) pinchState.active = false;
  tapInfo.active = false;
}, { passive: true });

// =========================================================
// 8) DEV-РЕЖИМ
// =========================================================
const dev = {
  mode: 'play',
  freeCam: { pos: new THREE.Vector3(), yaw: 0, pitch: 0 },
  transformControls: null,
  selectedObject: null,
};

const devToolsEl  = document.getElementById('dev-tools');
const devInfoEl   = document.getElementById('dev-info');
const coordPopup  = document.getElementById('coord-popup');
const btnCoords   = document.getElementById('btn-coords');
const btnEditor   = document.getElementById('btn-editor');
const btnSave     = document.getElementById('btn-save');
const btnExport   = document.getElementById('btn-export');
const btnReset    = document.getElementById('btn-reset');
const gizmoBtns   = document.querySelectorAll('.gizmo-btn');

if (isDev) { devToolsEl.classList.add('visible'); devInfoEl.classList.add('visible'); }

function setDevMode(mode) {
  dev.mode = mode;
  btnCoords.classList.toggle('active', mode === 'coords');
  btnEditor.classList.toggle('active', mode === 'editor');

  if (mode === 'coords') {
    dev.freeCam.pos.copy(camera.position);
    const dir = camera.getWorldDirection(new THREE.Vector3());
    dev.freeCam.yaw   = Math.atan2(-dir.x, -dir.z);
    dev.freeCam.pitch = Math.asin(Math.max(-1, Math.min(1, dir.y)));
    if (dev.transformControls) dev.transformControls.detach();
    dev.selectedObject = null;
  }
  if (mode !== 'editor' && dev.transformControls) {
    dev.transformControls.detach();
    dev.selectedObject = null;
  }
}

btnCoords.addEventListener('click', () => setDevMode(dev.mode === 'coords' ? 'play' : 'coords'));

btnEditor.addEventListener('click', () => {
  if (dev.mode === 'editor') { setDevMode('play'); return; }
  setDevMode('editor');
  if (!dev.transformControls) {
    const tc = new TransformControls(camera, renderer.domElement);
    if (tc.getHelper) scene.add(tc.getHelper()); else scene.add(tc);
    tc.addEventListener('dragging-changed', (e) => {
      if (!e.value && dev.selectedObject) snapObjectToGround(dev.selectedObject);
    });
    dev.transformControls = tc;
  }
});

gizmoBtns.forEach(b => b.addEventListener('click', () => {
  if (!dev.transformControls) return;
  if (b.id === 'btn-gizmo-translate') dev.transformControls.setMode('translate');
  if (b.id === 'btn-gizmo-rotate')    dev.transformControls.setMode('rotate');
  if (b.id === 'btn-gizmo-scale')     dev.transformControls.setMode('scale');
}));

btnSave.addEventListener('click', () => {
  const data = collectObjectTransforms();
  localStorage.setItem('savedObjects', JSON.stringify(data));
  alert('Сохранено объектов: ' + Object.keys(data).length);
});

btnExport.addEventListener('click', () => {
  const data = collectObjectTransforms();
  const code = 'const SAVED_OBJECTS = ' + JSON.stringify(data, null, 2) + ';';
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(code)
      .then(() => alert('Скопировано в буфер (' + Object.keys(data).length + ' об.)'))
      .catch(() => showExportDialog(code));
  } else {
    showExportDialog(code);
  }
});

btnReset.addEventListener('click', () => {
  if (confirm('Сбросить все сохранённые позиции?')) {
    localStorage.removeItem('savedObjects');
    location.reload();
  }
});

function showExportDialog(code) {
  const ta = document.createElement('textarea');
  ta.value = code;
  ta.style.cssText = 'position:fixed;top:10%;left:5%;width:90%;height:75%;z-index:10000;font-size:10px;padding:10px;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  const close = document.createElement('button');
  close.textContent = 'Закрыть';
  close.style.cssText = 'position:fixed;top:2%;right:5%;z-index:10001;padding:8px 14px;';
  close.onclick = () => { ta.remove(); close.remove(); };
  document.body.appendChild(close);
}

function collectObjectTransforms() {
  const out = {};
  if (!state.map) return out;
  state.map.traverse(o => {
    if (o.isMesh && o.userData.editId && o.userData.edited) {
      out[o.userData.editId] = {
        pos:   o.position.toArray().map(v => +v.toFixed(3)),
        rot:   [o.rotation.x, o.rotation.y, o.rotation.z].map(v => +v.toFixed(4)),
        scale: o.scale.toArray().map(v => +v.toFixed(3)),
      };
    }
  });
  return out;
}

function applySavedObjects() {
  if (!state.map) return;
  let data = null;
  try {
    const ls = JSON.parse(localStorage.getItem('savedObjects') || 'null');
    if (ls && Object.keys(ls).length) data = ls;
  } catch(e) {}
  if (!data && SAVED_OBJECTS && Object.keys(SAVED_OBJECTS).length) data = SAVED_OBJECTS;
  if (!data) return;

  state.map.traverse(o => {
    if (o.isMesh && o.userData.editId && data[o.userData.editId]) {
      const d = data[o.userData.editId];
      o.position.fromArray(d.pos);
      o.rotation.set(d.rot[0], d.rot[1], d.rot[2]);
      o.scale.fromArray(d.scale);
      o.userData.edited = true;
    }
  });
}

function snapObjectToGround(obj) {
  if (!state.map || !obj) return;
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty()) return;

  const center = box.getCenter(new THREE.Vector3());
  raycaster.set(new THREE.Vector3(center.x, box.max.y + 5, center.z), DOWN);
  raycaster.far = 1000;
  const hits = raycaster.intersectObject(state.map, true).filter(h => !isDescendantOf(h.object, obj) && h.object.visible);

  if (hits.length) {
    const groundY = hits[0].point.y;
    obj.position.y += groundY - box.min.y;
    obj.userData.edited = true;
  }
}

function handleTap(x, y) {
  const ndc = new THREE.Vector2((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);

  if (dev.mode === 'coords') {
    raycaster.setFromCamera(ndc, camera);
    raycaster.far = 1000;
    const hits = raycaster.intersectObjects(scene.children, true);
    if (hits.length) {
      const p = hits[0].point;
      coordPopup.textContent = `X: ${p.x.toFixed(2)}\nY: ${p.y.toFixed(2)}\nZ: ${p.z.toFixed(2)}`;
      coordPopup.classList.add('visible');
      setTimeout(() => coordPopup.classList.remove('visible'), 2500);
    }
  } else if (dev.mode === 'editor' && state.map) {
    raycaster.setFromCamera(ndc, camera);
    raycaster.far = 1000;
    const hits = raycaster.intersectObject(state.map, true);
    if (hits.length) {
      dev.selectedObject = hits[0].object;
      dev.selectedObject.userData.edited = true;
      dev.transformControls.attach(dev.selectedObject);
    } else {
      dev.selectedObject = null;
      dev.transformControls.detach();
    }
  }
}

function updateFreeCamera(dt) {
  const fc = dev.freeCam;
  const fwd = new THREE.Vector3(
    -Math.sin(fc.yaw) * Math.cos(fc.pitch),
     Math.sin(fc.pitch),
    -Math.cos(fc.yaw) * Math.cos(fc.pitch)
  );
  const rgt = new THREE.Vector3(Math.cos(fc.yaw), 0, -Math.sin(fc.yaw));

  const speed = 8;
  fc.pos.addScaledVector(fwd, state.input.forward * speed * dt);
  fc.pos.addScaledVector(rgt, state.input.right   * speed * dt);

  camera.position.copy(fc.pos);
  camera.lookAt(fc.pos.clone().add(fwd));
}

// =========================================================
// 9) ГЛАВНЫЙ ЦИКЛ
// =========================================================
let lastTime = performance.now();
let frameCount = 0, fpsTime = 0, fps = 60;

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;

  frameCount++; fpsTime += dt;
  if (fpsTime >= 0.5) { fps = Math.round(frameCount / fpsTime); frameCount = 0; fpsTime = 0; }

  updateInputFromButtons();

  if (dev.mode === 'coords') {
    updateFreeCamera(dt);
  } else {
    updatePhysics(dt);
    updateAnimation(dt);
    updateCamera(dt);
  }

  if (dev.transformControls) dev.transformControls.update();

  if (isDev) {
    sun.position.set(state.player.position.x + 20, state.player.position.y + 40, state.player.position.z + 20);
    sun.target.position.copy(state.player.position);
    sun.target.updateMatrixWorld();

    devInfoEl.textContent =
      `FPS: ${fps}\n` +
      `Mode: ${dev.mode}\n` +
      `P: ${state.player.position.x.toFixed(1)}, ${state.player.position.y.toFixed(1)}, ${state.player.position.z.toFixed(1)}\n` +
      `Grounded: ${state.player.grounded ? 'Y' : 'N'}`;
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
